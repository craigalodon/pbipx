description = "git commit --amend --dry-run -v prints the index against HEAD's parent. The corpus makes one commit, so HEAD is the root commit and has no parent: the gate's name-only diff from HEAD^ fails, and the command is denied as one that could not be checked (git-content), not by a tree scan, although the tree holds the finding. The Go tests cover a parent that exists"
command     = "gate"
args        = []
policy      = "default"
exit        = 2
sentinels   = ["Doe, Jane"]
known       = "predecessor"
