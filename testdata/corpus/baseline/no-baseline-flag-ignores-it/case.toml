description = "--no-baseline reports a warning the baseline would suppress"
command     = "scan"
args        = ["--all", "--strict", "--no-baseline"]
policy      = "default"
exit        = 2
sentinels   = ["Fall 2150"]

[[baseline]]
path     = "pbip/Example.Report/definition/pages/0000/visuals/0001/visual.json"
context  = "slicer-selection"
column   = "enrollment.cohort_year"
reasons  = ["warn-column"]
severity = "warn"
expires  = "2199-12-31"
