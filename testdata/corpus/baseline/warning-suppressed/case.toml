description = "a warning with an unexpired baseline entry is suppressed and counted"
command     = "scan"
args        = ["--all"]
policy      = "default"
exit        = 0
sentinels   = ["Fall 2150"]

[[baseline]]
path     = "pbip/Example.Report/definition/pages/0000/visuals/0001/visual.json"
context  = "slicer-selection"
column   = "enrollment.cohort_year"
reasons  = ["warn-column"]
severity = "warn"
expires  = "2199-12-31"
