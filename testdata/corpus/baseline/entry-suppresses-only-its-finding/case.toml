description = "a baseline entry suppresses its own finding and not another warning in the same report"
command     = "scan"
args        = ["--all", "--strict"]
policy      = "default"
exit        = 2
sentinels   = ["Fall 2150", "Section 0100"]

[[baseline]]
path     = "pbip/Example.Report/definition/pages/0000/visuals/0001/visual.json"
context  = "slicer-selection"
column   = "enrollment.cohort_year"
reasons  = ["warn-column"]
severity = "warn"
expires  = "2199-12-31"
