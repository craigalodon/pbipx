name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Third-party actions are pinned to a commit; Dependabot keeps them current.
jobs:
  lint:
    name: pre-commit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml') }}
      - run: pipx install pre-commit==4.7.0
      # The private-terms list exists only on a maintainer's machine.
      - run: pre-commit run --all-files --show-diff-on-failure
        env:
          SKIP: private-terms,private-terms-message

  test:
    # Linux only (ADR-0001, amendment). The maintainer tests Windows and macOS
    # by hand; the vet steps below keep that code compiling.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: git --version
      - run: go build ./...
      - run: go vet ./...
      - run: GOOS=windows go vet ./...
      - run: GOOS=darwin go vet ./...
      - run: go test -race ./...

  # Every commit message a pull request adds, scanned as the commit-msg hook
  # would. The repository has no policy of its own; the corpus's generic one
  # supplies the shape switches and allowlist prose scanning needs.
  commit-messages:
    # Dependabot signs its messages with GitHub's public bot address, which reads
    # as an email shape. A contributor cannot pose as this author.
    if: github.event_name == 'pull_request' && github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: go build -o "$RUNNER_TEMP/pbipx" ./cmd/pbipx
      - run: '"$RUNNER_TEMP/pbipx" scan-text --policy testdata/corpus/policies/default.toml --commits "origin/${BASE_REF}..HEAD"'
        env:
          BASE_REF: ${{ github.base_ref }}

  vulncheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...
