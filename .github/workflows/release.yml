name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

# Third-party actions are pinned to a commit; Dependabot keeps them current.
# The GoReleaser and cosign tool versions are pinned here by hand.
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          # No module or build cache: a cache another workflow wrote could
          # change what goes into a release.
          cache: false
      - run: go vet ./...
      - run: go test ./...

  # Builds a draft release; a person publishes it (.goreleaser.yaml).
  release:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the draft release and upload its assets
      id-token: write # Sigstore keyless signing of checksums.txt
    steps:
      # GoReleaser reads the full history and tags for the changelog. It
      # publishes through the API with GITHUB_TOKEN, so git needs no
      # credentials.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          # No module or build cache: a cache another workflow wrote could
          # change what goes into a release.
          cache: false
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.3
      - uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          distribution: goreleaser
          version: v2.18.3
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
