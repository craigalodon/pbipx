# Release builds: one static binary per platform (ADR-0001), with SHA-256
# checksums signed by Sigstore keyless signing. The release workflow
# (.github/workflows/release.yml) runs this on a v* tag. To try it locally,
# without signing or publishing:
#
#   go run github.com/goreleaser/goreleaser/v2@v2.18.3 release --snapshot --clean --skip=sign,publish
version: 2

project_name: pbipx

builds:
  - id: pbipx
    main: ./cmd/pbipx
    binary: pbipx
    env:
      - CGO_ENABLED=0
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    # Reproducible: no local paths, no build ids, and file times taken from
    # the commit.
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.version={{.Version}}
    mod_timestamp: "{{ .CommitTimestamp }}"

archives:
  - id: pbipx
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - README.md
      # The license goes in every archive; matching nothing is not an error.
      - LICENSE*
      - NOTICE

checksum:
  name_template: checksums.txt
  algorithm: sha256

# Keyless: the certificate is issued to the release workflow's GitHub OIDC
# identity and recorded in the public transparency log. The bundle holds the
# signature, certificate and log entry; README.md gives the verify command.
signs:
  - id: checksums
    cmd: cosign
    artifacts: checksum
    signature: "${artifact}.sigstore.json"
    args:
      - sign-blob
      - --bundle=${signature}
      - --yes
      - ${artifact}

changelog:
  use: git
  sort: asc
  filters:
    exclude:
      - "^Merge "

release:
  # A person reviews the draft and publishes it.
  draft: true
  replace_existing_draft: true
  prerelease: auto
